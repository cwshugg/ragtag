[package]
name = "ragtag"
version = "1.0.6"
edition = "2021"
description = "A note organization tool that parses and manages '@tag(attr=value)' from plain text files"
license = "MIT"
keywords = ["tag", "parser", "cli", "notes", "task"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "=0.0.12"
shlex = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
tempfile = "3"
getrandom = "0.3"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4.45", features = ["clock"] }
rustyline = "18.0.0"
terminal_size = "0.4"
fastrand = "=2.4.1"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
