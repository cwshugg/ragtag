name: CI

# Quality-assurance pipeline for the `ragtag` crate.
# Runs formatting, linting (warnings treated as errors), build, and tests.
on:
  # Only run push builds for the integration branch. Feature branches are
  # validated via their pull requests, which avoids duplicate runs and stops
  # CI from firing on release tags (handled by release.yml).
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read the repository contents.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Code Quality Assurance
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (with the
      # human-readable version in a trailing comment) for supply-chain safety.
      # Dependabot (.github/dependabot.yml) keeps these SHAs updated.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        # SHA-pinned to dtolnay/rust-toolchain@master; the concrete toolchain
        # version is selected explicitly below (not a moving @stable channel).
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, x86_64-apple-darwin

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

      - name: Check Windows and macOS compilation
        run: |
          cargo check --locked --target x86_64-pc-windows-msvc
          cargo check --locked --target x86_64-apple-darwin

      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false

      - name: Install pinned D2 parser and compiler
        env:
          D2_ARCHIVE_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
          D2_VERSION: 0.9.0
        run: |
          set -euo pipefail
          readonly archive="d2-v${D2_VERSION}-linux-amd64.tar.gz"
          readonly archive_path="${RUNNER_TEMP}/${archive}"
          readonly tool_dir="${RUNNER_TEMP}/d2-v${D2_VERSION}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "${archive_path}" \
            "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/${archive}"
          printf '%s  %s\n' "${D2_ARCHIVE_SHA256}" "${archive_path}" \
            | sha256sum --check --strict -
          mkdir -p "${tool_dir}"
          tar --extract --gzip --file "${archive_path}" \
            --directory "${tool_dir}" --strip-components=1 --no-same-owner
          printf '%s\n' "${tool_dir}/bin" >> "${GITHUB_PATH}"

      - name: Verify and build pinned D2 inspection helper
        working-directory: tests/tools/d2inspect
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          go mod verify
          go test -mod=readonly ./...
          go build -mod=readonly -trimpath -o d2inspect ./...

      - name: Test semantic D2 conformance
        run: cargo test --locked --test d2_conformance -- --ignored

      - name: Test CI and release workflow contracts
        run: >-
          python3 -m unittest discover
          -s .github/scripts
          -p "test_workflows.py"
          -v

      - name: Install pinned actionlint
        # The archive digest comes from the v1.7.12 release checksums asset;
        # the matcher digest pins the tagged source file's exact bytes.
        env:
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_MATCHER_SHA256: 5ec0c56e3947f155d8a9df6361653d97be7969d0bcb10f8c95f6be99b4888f0d
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail

          readonly archive_name="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          readonly tool_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          readonly archive_path="${RUNNER_TEMP}/${archive_name}"
          readonly matcher_path="${tool_dir}/actionlint-matcher.json"
          readonly release_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          readonly matcher_url="https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/.github/actionlint-matcher.json"

          mkdir -p "${tool_dir}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "${archive_path}" "${release_url}/${archive_name}"
          printf '%s  %s\n' "${ACTIONLINT_ARCHIVE_SHA256}" "${archive_path}" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "${archive_path}" \
            --directory "${tool_dir}" --no-same-owner actionlint
          chmod 0755 "${tool_dir}/actionlint"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            --output "${matcher_path}" "${matcher_url}"
          printf '%s  %s\n' "${ACTIONLINT_MATCHER_SHA256}" "${matcher_path}" \
            | sha256sum --check --strict -

          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"
          printf '::add-matcher::%s\n' "${matcher_path}"

      - name: Lint GitHub Actions workflows
        run: actionlint -verbose
