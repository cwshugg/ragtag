name: Release

# Cargo metadata is the only release-version source. Pushes are candidates only
# when the root manifest changes; manual runs recover the selected master
# commit's Cargo version and cannot override it.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: Detect Cargo version change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.release.outputs.build }}
      matrix: ${{ steps.release.outputs.matrix }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require the release branch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF}" != "refs/heads/master" ]]; then
            echo "::error::Manual releases must run from the master branch."
            exit 1
          fi

      - name: Checkout complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.90.0

      - name: Resolve Cargo release metadata
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python3 .github/scripts/release_meta.py detect
          --event "${EVENT_NAME}"
          --head "${HEAD_SHA}"
          --before "${BEFORE_SHA}"
          --github-output "${GITHUB_OUTPUT}"
          --github-repository "${REPOSITORY}"

  build:
    name: Build package (${{ matrix.target }})
    if: needs.detect.outputs.build == 'true'
    needs: detect
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}

      - name: Build and package binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: ragtag
          target: ${{ matrix.target }}
          archive: ragtag-v${{ needs.detect.outputs.version }}-${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Retain independent build digests
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: >-
          python3 .github/scripts/release_meta.py manifest
          --directory .
          --target "${RELEASE_TARGET}"
          --version "${RELEASE_VERSION}"
          --output "build-digests/${RELEASE_TARGET}.json"

      - name: Stage packaged release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: |
            ragtag-v${{ needs.detect.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
            ragtag-v${{ needs.detect.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Stage independent build digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.target }}
          path: build-digests/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create, repair, or verify draft release
    if: needs.detect.outputs.build == 'true'
    needs: [detect, build]
    runs-on: ubuntu-latest
    concurrency:
      group: ragtag-draft-release-${{ needs.detect.outputs.tag }}
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout tested release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Download independent build digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: build-digests
          merge-multiple: true

      - name: Generate commit-bound artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create, repair, or verify draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: >-
          python3 .github/scripts/release_meta.py ensure-draft
          --directory dist
          --manifests build-digests
          --repository "${GH_REPO}"
          --tag "${RELEASE_TAG}"
          --version "${RELEASE_VERSION}"
          --sha "${RELEASE_SHA}"
          --prerelease "${PRERELEASE}"
