# =============================================================================
# ragtag configuration
# =============================================================================
#
# Place this file as `.ragtag.yaml` or `ragtag.yaml` in your project root.
# ragtag searches upward from the current directory, stopping at a `.git`
# boundary. Use `--config <path>` or the `RAGTAG_CONFIG` environment variable
# to specify an explicit config file.
#
# Every field below has a default value — an empty file (or no file at all)
# is perfectly valid. Only override what you need.
# =============================================================================

# ---------------------------------------------------------------------------
# File Discovery
# ---------------------------------------------------------------------------

# Regex patterns for file paths to ignore. Matched against the relative path
# of each discovered file. Up to 256 patterns, each up to 1024 characters.
ignore_patterns:
  - ".*\\.pdf$"
  - ".*\\.png$"
  - "node_modules/"
  - "target/"
  - "vendor/"

# Whether to respect .gitignore rules when scanning files.
# Default: true
respect_gitignore: true

# Whether to skip hidden files and directories (names starting with `.`).
# Default: true
skip_hidden: true

# Maximum directory depth to scan. Unset or null means unlimited.
# Default: null (unlimited)
max_depth: 10

# Maximum file size in bytes to scan. Files larger than this are skipped.
# Must not exceed 104857600 (100 MB).
# Default: 10485760 (10 MB)
max_file_size: 10485760

# ---------------------------------------------------------------------------
# File Creation
# ---------------------------------------------------------------------------
#
# Used by `ragtag file touch` when `--path` is omitted. A relative directory
# is based on the selected config file's directory, or the startup working
# directory when there is no config. Paths are literal: `~` and environment
# variables are not expanded.
files:
  # May be relative, absolute, or contain parent components.
  # Missing parent directories are created recursively.
  # Default: "."
  default_directory: "."

  # Chrono strftime syntax, evaluated in UTC. The rendered value must be one
  # filename component. Common directives are %Y, %m, %d, %H, %M, and %S.
  # Add fractional seconds such as %3f to reduce same-second collisions.
  # Existing targets always cause an error; ragtag never overwrites or retries.
  # Default: "%Y-%m-%d_%H-%M-%S.md"
  filename_format: "%Y-%m-%d_%H-%M-%S.md"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

output:
  # Color mode for terminal output.
  # Options: "auto" (detect TTY), "always", "never"
  # Default: "auto"
  color: "auto"


# ---------------------------------------------------------------------------
# Aliases
# ---------------------------------------------------------------------------
#
# User-defined command aliases. Empty by default — there are no built-in
# aliases. Running `ragtag <name>` expands `arguments` (split with shell-like
# quoting) and runs it as if typed directly. Trailing args are appended, and
# aliases participate in prefix inference. An alias name must not collide with
# a real command (summary/query/config/file/task), be duplicated, or be empty.
aliases: []
  # - name: "ts"
  #   arguments: "task summary"
  # - name: "active"
  #   arguments: "query task --filter status=active"


# ---------------------------------------------------------------------------
# Task Extension
# ---------------------------------------------------------------------------
#
# Configuration for the built-in `@task(...)` tag extension.
# This section is optional — all fields have sensible defaults.

tasks:
  # The tag name that triggers the task extension.
  # Change this to scan for a different tag (e.g., "todo", "ticket").
  # Default: "task"
  tag_name: "task"

  # Default owner assigned to new tasks when `owner` is not specified.
  # Default: "me"
  default_owner: "me"

  # Default time units for `worktime_estimate` and `worktime_spent`.
  # Allowed values: "hours", "days", "weeks"
  # Default: "hours"
  default_worktime_units: "hours"

  # Default status for newly created tasks.
  # Must be one of the recognized status keywords below.
  # Default: "new"
  default_status: "new"

  # Status keywords grouped by category. Each category maps to an output
  # color: done=green, active=yellow, blocked=red, abandoned=orange,
  # inactive=gray. You can add custom keywords to any category.
  status_keywords:
    done:
      - "done"
      - "finished"
      - "complete"
      - "completed"
    active:
      - "active"
      - "underway"
      - "working"
      - "wip"
    blocked:
      - "blocked"
    abandoned:
      - "abandoned"
      - "deleted"
      - "removed"
      - "dead"
    inactive:
      - "inactive"
      - "pending"
      - "new"

  # Status categories to exclude from `task list` and `task summary` by default.
  # Use `--all` or `--filter status=<value>` to override.
  # Default: ["done", "abandoned"]
  exclude_status_categories:
    - "done"
    - "abandoned"
